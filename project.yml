name: semibold

options:
  bundleIdPrefix: com.semibold
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0
  SwiftLint:
    url: https://github.com/realm/SwiftLint
    from: 0.57.0

targets:
  semibold:
    type: application
    platform: iOS
    sources:
      - path: semibold
    dependencies:
      - package: GRDB
        product: GRDB
    plugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLint
    settings:
      base:
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: semibold/Info.plist
      properties:
        CFBundleDisplayName: Semibold
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    scheme:
      testTargets:
        - semiboldTests

  semiboldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: semiboldTests
    dependencies:
      - package: GRDB
        product: GRDB
      - target: semibold
    settings:
      base:
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
