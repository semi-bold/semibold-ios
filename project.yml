name: semibold

options:
  bundleIdPrefix: com.semibold
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftLint:
    url: https://github.com/realm/SwiftLint
    from: 0.57.0

targets:
  semibold:
    type: application
    platform: iOS
    sources:
      - path: semibold
    plugins:
      - plugin: SwiftLintBuildToolPlugin
        package: SwiftLint
    settings:
      base:
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: "H3FBP924CK"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: semibold/semibold.entitlements
        MARKETING_VERSION: "26.8.12"
    info:
      path: semibold/Info.plist
      properties:
        CFBundleDisplayName: Semibold
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - remote-notification
    scheme:
      testTargets:
        - name: semiboldTests
          parallelizable: false

  semiboldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: semiboldTests
    dependencies:
      - target: semibold
    settings:
      base:
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: "H3FBP924CK"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
